<title>A2MaTex Context Diagram</title>
<style>

  /* Layout: full-width centered SVG diagram, three concentric zones */
  :root {
    --bg: #f7f8fb;
    --fg: #1a1d2e;
    --fg-muted: #6b7190;
    --surface: #ffffff;
    --border: #d4d8e8;
    --accent: #3b6cf5;
    --accent-light: #e8eeff;
    --interior-bg: #eef3ff;
    --interior-stroke: #7da1f5;
    --system-bg: #3b6cf5;
    --system-fg: #ffffff;
    --exterior-bg: #fff5f0;
    --exterior-stroke: #e8644a;
    --exterior-fg: #9c3420;
    --arrow-in: #3b6cf5;
    --arrow-out: #64748b;
    --arrow-ext: #e8644a;
    --label-bg: rgba(255,255,255,0.94);
    --font-display: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1120;
      --fg: #e2e5f0;
      --fg-muted: #8b90ab;
      --surface: #1a1d30;
      --border: #2e3250;
      --accent: #6b93ff;
      --accent-light: #1e2545;
      --interior-bg: #161a30;
      --interior-stroke: #4a6ed0;
      --system-bg: #3b6cf5;
      --system-fg: #ffffff;
      --exterior-bg: #251a16;
      --exterior-stroke: #c05540;
      --exterior-fg: #f0a090;
      --arrow-in: #6b93ff;
      --arrow-out: #8b90ab;
      --arrow-ext: #e07050;
      --label-bg: rgba(26,29,48,0.94);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1120;
    --fg: #e2e5f0;
    --fg-muted: #8b90ab;
    --surface: #1a1d30;
    --border: #2e3250;
    --accent: #6b93ff;
    --accent-light: #1e2545;
    --interior-bg: #161a30;
    --interior-stroke: #4a6ed0;
    --system-bg: #3b6cf5;
    --system-fg: #ffffff;
    --exterior-bg: #251a16;
    --exterior-stroke: #c05540;
    --exterior-fg: #f0a090;
    --arrow-in: #6b93ff;
    --arrow-out: #8b90ab;
    --arrow-ext: #e07050;
    --label-bg: rgba(26,29,48,0.94);
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-display);
    padding-inline: 16px;
    padding-block: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }

  .diagram-header {
    text-align: center;
    padding: 28px 0 8px;
    max-width: 700px;
  }
  .diagram-header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .diagram-header p {
    font-size: 0.82rem;
    color: var(--fg-muted);
    margin: 0;
    line-height: 1.5;
  }

  .legend {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 10px 0 14px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1.5px solid;
  }

  .diagram-wrap {
    width: 100%;
    max-width: 1000px;
    overflow-x: auto;
  }
  .diagram-wrap svg {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
  }

  .diagram-footer {
    text-align: center;
    padding: 14px 0 28px;
    font-size: 0.72rem;
    color: var(--fg-muted);
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }
</style>

<div class="diagram-header">

</div>

  <div class="legend-item">

    Interior
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: var(--exterior-bg); border-color: var(--exterior-stroke);"></div>
    Exterior

  <div class="legend-item">

    Data flow
  </div>
</div>
